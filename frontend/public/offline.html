<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1683bd" />
    <title>Offline — Z's Purified</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: #f0f9ff; color: #0c4a6e; font-family: system-ui, sans-serif; text-align: center; }
      main { max-width: 420px; padding: 32px; background: white; border: 1px solid #bae6fd; border-radius: 20px; box-shadow: 0 12px 30px rgba(12,74,110,.1); }
      img { width: 96px; height: 96px; border-radius: 50%; }
      h1 { margin: 18px 0 8px; font-size: 24px; }
      p { margin: 0 0 20px; color: #475569; line-height: 1.5; }
      button { border: 0; border-radius: 10px; padding: 11px 18px; background: #1683bd; color: white; font: inherit; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="Z's Purified" />
      <h1>You’re offline</h1>
      <p>Connect to the internet before recording sales or changing inventory so every account stays synchronized.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
